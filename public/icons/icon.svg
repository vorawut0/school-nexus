<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e" />
      <stop offset="50%" stop-color="#0e1e42" />
      <stop offset="100%" stop-color="#143275" />
    </linearGradient>

    <!-- Sky / Circle Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#93c5fd" />
      <stop offset="85%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- 3D 'S' Cyber Blue Gradient -->
    <linearGradient id="sGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#7dd3fc" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="sGradSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2d6b" />
      <stop offset="60%" stop-color="#081b44" />
      <stop offset="100%" stop-color="#030b20" />
    </linearGradient>

    <!-- Chrome Silver Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Cyan to Magenta X Glow -->
    <linearGradient id="xGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="shadowHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Glow & Badge Base -->
  <circle cx="256" cy="225" r="188" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadowHeavy)" />

  <!-- Inner Sky Circle -->
  <circle cx="256" cy="225" r="166" fill="url(#skyGrad)" />

  <!-- Golden Laurel Wreath (Left & Right) -->
  <g fill="url(#goldGrad)" opacity="0.95" filter="url(#shadowHeavy)">
    <!-- Left Leaves -->
    <path d="M 98,280 C 82,240 85,180 120,130 C 114,145 110,165 112,185 C 92,192 82,212 85,232 C 72,248 76,270 98,280 Z" />
    <path d="M 88,320 C 72,295 76,260 92,238 C 76,258 74,285 88,320 Z" />
    <path d="M 125,370 C 95,340 86,305 92,275 C 80,310 92,348 125,370 Z" />
    <!-- Right Leaves -->
    <path d="M 414,280 C 430,240 427,180 392,130 C 398,145 402,165 400,185 C 420,192 430,212 427,232 C 440,248 436,270 414,280 Z" />
    <path d="M 424,320 C 440,295 436,260 420,238 C 436,258 438,285 424,320 Z" />
    <path d="M 387,370 C 417,340 426,305 420,275 C 432,310 420,348 387,370 Z" />
  </g>

  <!-- School Building & Campus Silhouette in Background -->
  <g opacity="0.85">
    <rect x="180" y="200" width="152" height="60" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="3" />
    <rect x="195" y="210" width="22" height="18" fill="#38bdf8" opacity="0.75" rx="2" />
    <rect x="225" y="210" width="22" height="18" fill="#38bdf8" opacity="0.75" rx="2" />
    <rect x="265" y="210" width="22" height="18" fill="#38bdf8" opacity="0.75" rx="2" />
    <rect x="295" y="210" width="22" height="18" fill="#38bdf8" opacity="0.75" rx="2" />
    <!-- Thai Flag Pole -->
    <line x1="165" y1="160" x2="165" y2="245" stroke="#94a3b8" stroke-width="2.5" />
    <!-- Thai Flag -->
    <g transform="translate(166, 162)">
      <rect x="0" y="0" width="22" height="3" fill="#ef4444" />
      <rect x="0" y="3" width="22" height="3" fill="#ffffff" />
      <rect x="0" y="6" width="22" height="6" fill="#1e3a8a" />
      <rect x="0" y="12" width="22" height="3" fill="#ffffff" />
      <rect x="0" y="15" width="22" height="3" fill="#ef4444" />
    </g>
  </g>

  <!-- Holographic Floating Digital Hub Badges -->
  <g filter="url(#neonGlow)" opacity="0.9">
    <!-- Left Book Icon -->
    <rect x="110" y="180" width="32" height="32" rx="8" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 118,193 C 122,190 126,190 126,203 C 126,190 130,190 134,193" stroke="#ffffff" stroke-width="2" fill="none" />
    <!-- Right Cap Icon -->
    <rect x="370" y="180" width="32" height="32" rx="8" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="386,188 397,194 386,200 375,194" fill="#ffffff" />
    <!-- Right Chart Icon -->
    <rect x="382" y="222" width="30" height="30" rx="8" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="390" y1="244" x2="390" y2="238" stroke="#ffffff" stroke-width="2.5" />
    <line x1="397" y1="244" x2="397" y2="232" stroke="#ffffff" stroke-width="2.5" />
    <line x1="404" y1="244" x2="404" y2="228" stroke="#ffffff" stroke-width="2.5" />
    <!-- Right Calendar Icon -->
    <rect x="368" y="262" width="28" height="28" rx="7" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="374" y="270" width="16" height="14" fill="none" stroke="#ffffff" stroke-width="1.5" rx="1" />
  </g>

  <!-- Glowing 3D 'S' Cyber Monogram with Orbit Ring -->
  <g filter="url(#shadowHeavy)">
    <!-- 3D S Shadow Extrusion -->
    <path d="M 295,115 C 330,120 345,150 330,185 C 315,220 230,225 220,250 C 210,275 235,300 280,295 L 280,315 C 215,325 185,280 200,240 C 215,200 300,195 310,170 C 320,145 295,128 260,132 Z" fill="url(#sGradSide)" />
    
    <!-- 3D S Front Face -->
    <path d="M 285,108 C 320,113 335,143 320,178 C 305,213 220,218 210,243 C 200,268 225,293 270,288 L 265,306 C 205,315 178,272 192,234 C 206,196 290,190 300,165 C 310,140 288,122 250,126 Z" fill="url(#sGradFront)" stroke="#ffffff" stroke-width="3.5" />

    <!-- Futuristic Orbit Ring & Sphere -->
    <ellipse cx="260" cy="225" rx="145" ry="42" fill="none" stroke="#38bdf8" stroke-width="4.5" transform="rotate(-18 260 225)" filter="url(#neonGlow)" />
    <circle cx="370" cy="165" r="13" fill="url(#sGradFront)" stroke="#ffffff" stroke-width="2.5" filter="url(#neonGlow)" />
  </g>

  <!-- Top Academic Graduation Cap (Mortarboard) -->
  <g filter="url(#shadowHeavy)">
    <polygon points="256,42 375,100 256,155 137,100" fill="#0b1736" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round" />
    <polygon points="256,52 355,100 256,146 157,100" fill="#172554" />
    <!-- Center Button Pin & Gold Tassel -->
    <ellipse cx="256" cy="100" rx="9" ry="6" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5" />
    <path d="M 256,100 Q 345,115 350,165" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <circle cx="350" cy="170" r="6" fill="url(#goldGrad)" />
    <path d="M 346,175 L 344,205 L 356,205 L 354,175 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Main SCHOOL NEXUS Banner Section -->
  <g transform="translate(256, 385)" filter="url(#shadowHeavy)">
    <!-- Dark Blue Metallic Outer Armor Plaque -->
    <path d="M -200,-50 L 200,-50 L 225,-10 L 195,45 L -195,45 L -225,-10 Z" fill="#080e1c" stroke="url(#xGlow)" stroke-width="4" stroke-linejoin="round" />
    <path d="M -192,-44 L 192,-44 L 214,-10 L 188,39 L -188,39 L -214,-10 Z" fill="#0d1b38" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- Top Sub-Title 'SCHOOL' -->
    <text x="0" y="-22" font-family="'Noto Sans Thai', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" fill="url(#chromeGrad)" text-anchor="middle" letter-spacing="8" font-style="italic">SCHOOL</text>

    <!-- Main Bold 'NEXUS' with Cyan-Magenta X -->
    <g transform="translate(0, 16)">
      <text x="-96" y="10" font-family="'Noto Sans Thai', 'Inter', -apple-system, sans-serif" font-size="46" font-weight="900" fill="url(#chromeGrad)" text-anchor="middle" font-style="italic">NE</text>
      <!-- Stylized X -->
      <text x="0" y="11" font-family="'Noto Sans Thai', 'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#xGlow)" text-anchor="middle" font-style="italic" filter="url(#neonGlow)">X</text>
      <text x="96" y="10" font-family="'Noto Sans Thai', 'Inter', -apple-system, sans-serif" font-size="46" font-weight="900" fill="url(#chromeGrad)" text-anchor="middle" font-style="italic">US</text>
    </g>
  </g>

  <!-- Lower Plaque with Motto & Open Book Crest -->
  <g transform="translate(256, 460)" filter="url(#shadowHeavy)">
    <!-- Motto Capsule -->
    <rect x="-160" y="-18" width="320" height="28" rx="14" fill="#080e1e" stroke="url(#goldGrad)" stroke-width="2.5" />
    <text x="0" y="1" font-family="'Noto Sans Thai', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">“เชื่อมทุกความรู้ สู่อนาคตที่ยิ่งใหญ่”</text>

    <!-- Glowing Open Book at the very bottom -->
    <g transform="translate(0, 22)">
      <path d="M 0,-4 Q -25,-18 -50,-8 L -50,14 Q -25,4 0,16 Q 25,4 50,14 L 50,-8 Q 25,-18 0,-4 Z" fill="#0b1736" stroke="url(#goldGrad)" stroke-width="3" />
      <path d="M 0,-2 Q -22,-14 -44,-6 L -44,10 Q -22,2 0,12 Q 22,2 44,10 L 44,-6 Q 22,-14 0,-2 Z" fill="#38bdf8" opacity="0.35" filter="url(#neonGlow)" />
    </g>
  </g>
</svg>
